name: Production Readiness

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:migration:check
      - run: pnpm security:test

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.api -t island-empires-api:${{ github.sha }} .
      - run: docker build -f deploy/Dockerfile.web -t island-empires-web:${{ github.sha }} .
      - run: docker build -f deploy/Dockerfile.worker -t island-empires-worker:${{ github.sha }} .
      - run: docker build -f deploy/Dockerfile.admin -t island-empires-admin:${{ github.sha }} .

  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: docker
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - run: scripts/deploy.sh staging
      - run: scripts/smoke-test.sh "$STAGING_BASE_URL"

  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: staging
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: scripts/deploy.sh production
      - run: scripts/smoke-test.sh "$PRODUCTION_BASE_URL"
